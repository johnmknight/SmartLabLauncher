<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTLAB · LAUNCHER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070F; --green: #41ff6b; --glow: rgba(65,255,107,0.6);
    --chrome-h: 28px; --chrome-b: 24px;
    --chrome-fg: rgba(255,255,255,0.55);
    --chrome-border: rgba(255,255,255,0.10);
    --mono: 'Share Tech Mono','Courier New',monospace;
    --orb:  'Orbitron','Courier New',monospace;
    --btn-w: 380px; --btn-h: 470px; --btn-gap: 22px;
    --btn-radius: 3px; --code-size: 82px;
    --glyph-size: 70px; --glyph-inset-l: 14px; --glyph-inset-b: 14px;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:var(--bg);
    color:rgba(255,255,255,0.85); font-family:var(--mono);
    overflow:hidden; user-select:none; }

  /* ── chrome bars ── */
  #chrome-top, #chrome-bot {
    position:fixed; left:0; right:0; display:flex;
    justify-content:space-between; align-items:center;
    padding:0 16px; background:rgba(7,7,15,0.95); z-index:20;
    letter-spacing:0.12em; color:var(--chrome-fg); font-family:var(--mono);
  }
  #chrome-top { top:0; height:var(--chrome-h); font-size:11px;
    border-bottom:1px solid var(--chrome-border); }
  #chrome-bot { bottom:0; height:var(--chrome-b); font-size:9px;
    border-top:1px solid var(--chrome-border); }

  /* ── CLI overlay ── */
  #cli {
    position:fixed; inset:0;
    top:var(--chrome-h); bottom:var(--chrome-b);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:32px 48px; z-index:15; background:var(--bg);
    transition:opacity 0.8s ease; overflow:hidden;
  }
  #cli.hide { opacity:0; pointer-events:none; }
  #cli-lines { display:flex; flex-direction:column; gap:6px; }

  .cli-row { display:flex; align-items:baseline;
    font-family:var(--mono); font-size:28px; line-height:1.5;
    opacity:0; transition:opacity 0.1s; }
  .cli-row.show { opacity:1; }
  .cli-prompt { color:var(--green); margin-right:12px; flex-shrink:0; }
  .cli-text   { color:var(--green); white-space:pre; }
  .cli-response { color:rgba(180,255,210,0.7); font-size:22px; padding-left:40px; }
  .cli-cursor, .boot-cursor {
    display:inline-block; width:16px; height:3px; background:var(--green);
    margin-left:3px; vertical-align:baseline; position:relative; top:-4px;
    animation:blink 0.9s step-end infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* CRT scanlines on CLI only */
  #cli::before { content:''; position:absolute; inset:0; z-index:20; pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      transparent 0px,transparent 2px,rgba(0,0,0,0.26) 2px,rgba(0,0,0,0.26) 4px); }
  #cli { text-shadow:0 0 4px var(--green),0 0 12px rgba(65,255,107,0.38),0 0 24px rgba(65,255,107,0.15); }
  .cli-prompt { text-shadow:-1px 0 1px rgba(255,40,40,0.4),1px 0 1px rgba(40,80,255,0.4),
    0 0 8px var(--green),0 0 18px rgba(65,255,107,0.3); }
  .cli-response { text-shadow:0 0 7px rgba(160,255,190,0.28); }

  /* ── button field ── */
  #button-field {
    position:fixed; top:var(--chrome-h); bottom:var(--chrome-b);
    left:0; right:0; display:flex; align-items:center;
    justify-content:center; gap:var(--btn-gap); padding:0 32px;
    z-index:10; opacity:0; transition:opacity 0.3s ease;
  }
  #button-field.show { opacity:1; }

  .monolith {
    position:relative; width:var(--btn-w); height:var(--btn-h);
    background:var(--col); border-radius:var(--btn-radius);
    text-decoration:none; color:rgba(255,255,255,0.88);
    display:flex; flex-direction:column; align-items:center;
    overflow:hidden; flex-shrink:0; outline:none;
    transition:filter 0.15s ease, transform 0.15s ease;
    opacity:0;
  }
  .monolith:hover  { filter:brightness(1.18); transform:translateY(-3px); cursor:pointer; }
  .monolith:active { transform:translateY(0); filter:brightness(0.92); }
  .monolith.focused { box-shadow:0 0 0 2px rgba(255,255,255,0.55); }
  .monolith::before { content:''; position:absolute; top:0; left:0; right:0;
    height:1px; background:rgba(255,255,255,0.22); z-index:2; }
  .monolith::after  { content:''; position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(0,0,0,0.35); pointer-events:none; z-index:2; }

  /* offline state */
  .monolith.offline { filter:brightness(0.35) saturate(0.3); }
  .monolith.offline::after { content:''; position:absolute; inset:0; z-index:6;
    background:repeating-linear-gradient(-45deg,
      transparent,transparent 10px,rgba(255,255,255,0.07) 10px,rgba(255,255,255,0.07) 14px);
    pointer-events:none; }

  /* Three.js bg canvas */
  .monolith .btn-bg-canvas {
    position:absolute; inset:0; width:100%!important; height:100%!important;
    z-index:0; opacity:0; transition:opacity 1.4s ease;
    pointer-events:none; }
  .monolith .btn-bg-canvas.show { opacity:1; }

  .monolith-inner { display:flex; flex-direction:column; align-items:center;
    justify-content:center; flex:1; width:100%; z-index:1; }
  .corner { position:absolute; font-size:8px; letter-spacing:0.08em;
    color:rgba(255,255,255,0.42); font-family:var(--mono); z-index:3; opacity:0; }
  .tl{top:8px;left:9px;} .tr{top:8px;right:9px;} .br{bottom:8px;right:9px;}
  .status-dot { font-size:7px; }
  .status-dot.online  { color:#3ddc84; }
  .status-dot.offline { color:#cc3333; }
  .status-dot.unknown { color:rgba(255,255,255,0.25); }

  .code { font-size:var(--code-size); font-weight:900; letter-spacing:0.06em;
    font-family:var(--orb); line-height:1; color:rgba(255,255,255,0.92);
    text-align:center; padding:0 8px; opacity:0; z-index:1; }
  .rule { width:calc(100% - 24px); height:1px;
    background:rgba(255,255,255,0.18); margin:7px 0; flex-shrink:0; z-index:1; }
  .app-name { font-size:13px; letter-spacing:0.18em;
    color:rgba(255,255,255,0.65); text-align:center; padding:0 8px; opacity:0; z-index:1; }
  .glyph-wrap { position:absolute; bottom:var(--glyph-inset-b); left:var(--glyph-inset-l);
    width:var(--glyph-size); height:var(--glyph-size); z-index:3; opacity:0; }
  .glyph-svg  { width:100%; height:100%; overflow:visible; }
  .cobb-outer { fill:none; stroke:rgba(255,255,255,0.88); stroke-width:1.8; }
  .cobb-inner { fill:none; stroke:rgba(255,255,255,0.20); stroke-width:0.5; }
</style>
</head>
<body>

<!-- TOP CHROME -->
<div id="chrome-top">
  <span>SMARTLAB &middot; LAUNCHER</span>
  <span id="utc-clock">--:--:-- UTC</span>
</div>

<!-- CLI OVERLAY (only visible on first boot) -->
<div id="cli">
  <div id="cli-lines"></div>
</div>
<div id="skip-btn"
  onclick="skipCLI=true;this.style.display='none';"
  style="position:fixed;bottom:40px;right:48px;z-index:30;
    font-family:'Share Tech Mono',monospace;font-size:13px;
    color:rgba(65,255,107,0.6);cursor:pointer;letter-spacing:0.15em;
    border:1px solid rgba(65,255,107,0.35);padding:5px 14px;display:none;">
  [ SKIP ]
</div>

<!-- BUTTON FIELD (populated dynamically from CommandDeck API) -->
<div id="button-field">
</div><!-- /#button-field -->

<!-- BOTTOM CHROME -->
<div id="chrome-bot">
  <span>APPSERV1 &middot; 192.168.4.148 &middot; <span id="container-count">— CONTAINERS</span></span>
  <span>NGINX :80</span>
</div>


<script>
// ── Utilities ──
const wait = ms => new Promise(r => setTimeout(r, ms));
let skipCLI = false;
const waitSkippable = ms => new Promise(r => {
  const t = setTimeout(r, ms);
  const check = setInterval(() => { if (skipCLI) { clearTimeout(t); clearInterval(check); r(); } }, 50);
});

// ── Audio ──
let _ctx = null;
function getCtx() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  return _ctx;
}
function beep() {
  try {
    const ctx = getCtx();
    const bufSize = ctx.sampleRate * 0.008;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 180 + Math.random() * 120; bp.Q.value = 0.8;
    const gain = ctx.createGain();
    noise.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.55, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.025);
    noise.start(ctx.currentTime); noise.stop(ctx.currentTime + 0.03);
  } catch(e) {}
}
function softBeep() {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}
function endChime() {
  try {
    const ctx = getCtx(), gain = ctx.createGain(); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
    [520, 780].forEach((freq, i) => {
      const osc = ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(gain);
      osc.start(ctx.currentTime + i * 0.04);
      osc.stop(ctx.currentTime + 1.0);
    });
  } catch(e) {}
}

// ── CLI machinery ──
const linesEl = document.getElementById('cli-lines');
function addRow(isResponse) {
  const row = document.createElement('div');
  row.className = 'cli-row' + (isResponse ? ' cli-response' : '');
  if (!isResponse) {
    const p = document.createElement('span');
    p.className = 'cli-prompt'; p.textContent = '>';
    row.appendChild(p);
  }
  const text = document.createElement('span'); text.className = 'cli-text';
  row.appendChild(text); linesEl.appendChild(row);
  requestAnimationFrame(() => row.classList.add('show'));
  return text;
}
async function typeInto(el, str, charDelay, withCursor) {
  let cursor = null;
  if (withCursor) {
    cursor = document.createElement('span'); cursor.className = 'cli-cursor';
    el.parentElement.appendChild(cursor);
  }
  for (const ch of str) {
    if (skipCLI) { el.textContent = str; return cursor; }
    el.textContent += ch; beep(); await wait(charDelay);
  }
  return cursor;
}
</script>

<script>
// ── Global app state (populated from CommandDeck API) ──
let APPS = [];     // array from GET /api/apps
// App server: always appserv1 nginx — this launcher exists to open production apps
const APP_SERVER = (location.hostname === '192.168.4.148')
  ? window.location.origin                // already on appserv1
  : 'http://192.168.4.148';              // dev: point to appserv1
// CommandDeck API: may be behind nginx or direct for local dev
const CDK_BASE = (location.port === '7700' || location.port === '8090')
  ? 'http://localhost:8090' : APP_SERVER + '/deck';

// ── Legacy glyph SVG (inner content only, no Cobb border) ──
const LEGACY_GLYPHS = {
  STB: `<rect x="14" y="17" width="42" height="8" rx="1" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
    <rect x="14" y="31" width="42" height="8" rx="1" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
    <rect x="14" y="45" width="42" height="8" rx="1" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
    <rect x="28" y="19" width="14" height="4" rx="1" fill="rgba(255,255,255,0.3)"/>
    <rect x="28" y="33" width="14" height="4" rx="1" fill="rgba(255,255,255,0.3)"/>
    <rect x="28" y="47" width="14" height="4" rx="1" fill="rgba(255,255,255,0.3)"/>`,
  CDK: `<line x1="35" y1="12" x2="35" y2="58" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
    <line x1="12" y1="35" x2="58" y2="35" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
    <rect x="13" y="13" width="20" height="20" fill="rgba(255,255,255,0.18)"/>
    <rect x="37" y="13" width="20" height="20" fill="rgba(255,255,255,0.07)"/>
    <rect x="13" y="37" width="20" height="20" fill="rgba(255,255,255,0.07)"/>
    <rect x="37" y="37" width="20" height="20" fill="rgba(255,255,255,0.12)"/>`,
  AO: `<ellipse cx="35" cy="38" rx="18" ry="10" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="35" cy="38" r="5" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.4"/>
    <circle cx="35" cy="38" r="2" fill="rgba(255,255,255,0.7)"/>
    <circle cx="53" cy="38" r="2.5" fill="rgba(255,255,255,0.9)"/>
    <line x1="53" y1="41" x2="53" y2="46" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <path d="M 18 22 Q 35 14 52 22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>`,
  MSO: `<rect x="14" y="16" width="42" height="11" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"/>
    <rect x="14" y="31" width="42" height="11" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"/>
    <rect x="14" y="46" width="42" height="11" rx="1" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"/>`,
};

// ── Create a monolith button element from app data ──
function createButton(app, index) {
  const el = document.createElement('a');
  el.className = 'monolith';
  el.id = 'btn-' + app.code.toLowerCase();
  el.style.setProperty('--col', app.color);
  el.href = APP_SERVER + (app.route_path || '/');
  el.target = '_blank';
  el.dataset.key = String(index + 1);

  const canvasId = 'bg-' + app.code.toLowerCase();
  const dotId = 'dot-' + app.code.toLowerCase();
  const innerSvg = app.glyph_svg || LEGACY_GLYPHS[app.code] || '';

  el.innerHTML = `
    <canvas class="btn-bg-canvas" id="${canvasId}"></canvas>
    <div class="corner tl">SYS&middot;${String(index+1).padStart(2,'0')} <span class="status-dot unknown" id="${dotId}">●</span></div>
    <div class="corner tr">:${app.port}</div>
    <div class="monolith-inner">
      <div class="code">${app.code}</div><div class="rule"></div>
      <div class="app-name">${app.name.toUpperCase()}</div>
    </div>
    <div class="glyph-wrap"><svg class="glyph-svg" viewBox="0 0 70 70">
      <polygon class="cobb-outer" points="9,1 61,1 69,9 69,61 61,69 9,69 1,61 1,9"/>
      <polygon class="cobb-inner" points="11,4 59,4 66,11 66,59 59,66 11,66 4,59 4,11"/>
      ${innerSvg}
    </svg></div>
    <div class="corner br">APPSERV1</div>`;
  return el;
}

// ── Build all buttons into the DOM ──
function buildButtons() {
  const bf = document.getElementById('button-field');
  bf.innerHTML = '';
  APPS.forEach((app, i) => bf.appendChild(createButton(app, i)));
}

// ── Button reveal helpers ──
function revealButtons(instant) {
  const bf = document.getElementById('button-field');
  const btns = bf.querySelectorAll('.monolith');
  bf.classList.add('show');
  if (instant) {
    btns.forEach(b => {
      b.style.transition = 'none'; b.style.opacity = '1';
      b.querySelectorAll('.code,.app-name,.glyph-wrap,.corner').forEach(el => {
        el.style.transition = 'none'; el.style.opacity = '1';
      });
      b.querySelectorAll('.corner').forEach(c => c.style.opacity = '0.75');
    });
    initAllBackgrounds();
  }
}

// ── Full boot animation (driven by APPS array) ──
async function runCLI() {
  skipCLI = false;
  document.getElementById('skip-btn').style.display = 'block';
  await waitSkippable(800);

  for (const app of APPS) {
    const cmd = 'LOAD APPSERV1\\' + app.code;
    const ok  = 'Connection established  \u2014  APPSERV1\\' + app.code + ' online.  Loading interface in background.';

    const cmdEl = addRow(false);
    const cursor = await typeInto(cmdEl, cmd, 58, true);
    await waitSkippable(500);
    if (cursor) cursor.remove();
    await waitSkippable(200);

    const respEl = addRow(true);
    respEl.style.color = 'rgba(180,255,210,0.75)';
    await typeInto(respEl, ok, 22, false);
    await waitSkippable(520);
  }

  await waitSkippable(900);

  if (!skipCLI) {
    const finalRow = document.createElement('div');
    finalRow.className = 'cli-row show';
    finalRow.innerHTML = '<span class="cli-prompt">&gt;</span><span class="boot-cursor" style="margin-left:6px"></span>';
    linesEl.appendChild(finalRow);
    await waitSkippable(1400);
    finalRow.querySelector('.boot-cursor').remove();
  }

  const halResp = addRow(true);
  halResp.style.color = 'rgba(180,255,210,0.85)';
  await typeInto(halResp, 'HAL71 Interface Loaded..', 38, false);
  await waitSkippable(400);
  endChime();
  document.getElementById('skip-btn').style.display = 'none';
  await waitSkippable(1200);

  const cli = document.getElementById('cli');
  cli.style.opacity = '0';
  await wait(700);
  cli.style.display = 'none';

  const btns = document.querySelectorAll('#button-field .monolith');
  document.getElementById('button-field').classList.add('show');

  for (const btn of btns) {
    btn.style.transition = 'opacity 0.6s ease'; btn.style.opacity = '1';
    softBeep(); await wait(620);
  }
  await wait(400);

  btns.forEach(btn => {
    const g = btn.querySelector('.glyph-wrap');
    if (g) { g.style.transition = 'opacity 0.5s ease'; g.style.opacity = '1'; }
  });
  await wait(750);

  btns.forEach(btn => {
    const code = btn.querySelector('.code');
    const name = btn.querySelector('.app-name');
    if (code) { code.style.transition = 'opacity 0.5s ease'; code.style.opacity = '1'; }
    if (name) { name.style.transition = 'opacity 1.2s ease'; name.style.opacity = '1'; }
  });
  await wait(700);

  btns.forEach(btn => {
    btn.querySelectorAll('.corner').forEach(c => {
      c.style.transition = 'opacity 1.2s ease'; c.style.opacity = '0.75';
    });
  });
  await wait(800);

  initAllBackgrounds();
  sessionStorage.setItem('hal71-booted', '1');
}

// ── Boot entry point ──
window.addEventListener('DOMContentLoaded', async () => {
  // Fetch app manifest from CommandDeck
  try {
    const r = await fetch(CDK_BASE + '/api/apps');
    if (!r.ok) throw new Error(r.status);
    APPS = await r.json();
  } catch (e) {
    console.error('Failed to fetch app manifest:', e);
    // Fallback: show error in CLI area
    document.getElementById('cli').style.display = 'flex';
    const errEl = addRow(true);
    errEl.style.color = 'rgba(255,120,100,0.85)';
    errEl.textContent = 'ERR: Cannot reach CommandDeck API. Check that CommandDeck is running.';
    return;
  }

  buildButtons();

  if (sessionStorage.getItem('hal71-booted')) {
    document.getElementById('cli').style.display = 'none';
    revealButtons(true);
  } else {
    runCLI();
  }
});
</script>

<script>
// ── UTC Clock ──
function updateClock() {
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('utc-clock').textContent =
    `${p(n.getUTCHours())}:${p(n.getUTCMinutes())}:${p(n.getUTCSeconds())} UTC`;
}
updateClock(); setInterval(updateClock, 1000);

// ── Status polling — driven by APPS array ──
function setDot(code, state) {
  const lc = code.toLowerCase();
  const dot = document.getElementById('dot-' + lc);
  if (dot) dot.className = 'status-dot ' + state;
  const btn = document.getElementById('btn-' + lc);
  if (btn) btn.classList.toggle('offline', state === 'offline');
}

async function checkApp(app) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    await fetch(APP_SERVER + (app.route_path || '/'), { method:'HEAD', mode:'no-cors', signal:ctrl.signal });
    clearTimeout(timer);
    setDot(app.code, 'online');
  } catch {
    setDot(app.code, 'offline');
  }
}

function pollAll() { APPS.forEach(checkApp); }
setTimeout(pollAll, 2000); // delay first poll until buttons are built
setInterval(pollAll, 30000);

// ── Container count ──
async function updateContainerCount() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(APP_SERVER + '/deck/api/containers', { signal:ctrl.signal });
    if (r.ok) {
      const data = await r.json();
      const running = Array.isArray(data)
        ? data.filter(c => c.status === 'running' || c.State === 'running').length
        : (data.running ?? data.count ?? '?');
      document.getElementById('container-count').textContent =
        `${running} CONTAINER${running !== 1 ? 'S' : ''} RUNNING`;
    }
  } catch { /* keep placeholder */ }
}
updateContainerCount();
setInterval(updateContainerCount, 60000);

// ── Keyboard nav (dynamic — keys 1..N based on APPS count) ──
let focusedKey = null;

document.addEventListener('keydown', e => {
  const idx = parseInt(e.key) - 1;
  if (isNaN(idx) || idx < 0 || idx >= APPS.length) return;
  const btnId = 'btn-' + APPS[idx].code.toLowerCase();
  e.preventDefault();
  document.querySelectorAll('.monolith').forEach(el => el.classList.remove('focused'));
  if (focusedKey === e.key) {
    window.open(document.getElementById(btnId).href, '_blank');
    focusedKey = null;
  } else {
    document.getElementById(btnId).classList.add('focused');
    focusedKey = e.key;
  }
});
document.addEventListener('click', e => {
  if (e.target.closest('.monolith')) {
    document.querySelectorAll('.monolith').forEach(b => b.classList.remove('focused'));
    focusedKey = null;
  }
});
</script>

<script>
// ── Shared Three.js helpers ──
function makeRenderer(canvas) {
  const W = canvas.parentElement.offsetWidth, H = canvas.parentElement.offsetHeight;
  const r = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  r.setPixelRatio(window.devicePixelRatio); r.setSize(W, H); r.setClearColor(0x000000, 0);
  return r;
}
function makeWF(hullColor, lineColor) {
  const THICK = 0.016;
  const matH = new THREE.MeshBasicMaterial({ color:hullColor, polygonOffset:true, polygonOffsetFactor:4, polygonOffsetUnits:4 });
  const matE = new THREE.LineBasicMaterial({ color:lineColor, transparent:true, opacity:0.78 });
  const matO = new THREE.MeshBasicMaterial({ color:lineColor, side:THREE.BackSide, transparent:true, opacity:0.50, depthTest:true, depthWrite:false });
  return function wf(mesh, group) {
    mesh.material = matH.clone();
    const og=mesh.geometry.clone(); og.computeVertexNormals();
    const p=og.attributes.position, n=og.attributes.normal;
    for(let i=0;i<p.count;i++) p.setXYZ(i,p.getX(i)+n.getX(i)*THICK,p.getY(i)+n.getY(i)*THICK,p.getZ(i)+n.getZ(i)*THICK);
    p.needsUpdate=true;
    mesh.add(new THREE.Mesh(og,matO.clone()));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,15),matE.clone()));
    group.add(mesh);
  };
}

// ── STB: Ammo can ──
function initSTB(canvas) {
  const scene=new THREE.Scene(), wf=makeWF(0x1A42CC, 0xd0e8ff);
  const r=makeRenderer(canvas);
  const W=canvas.parentElement.offsetWidth, H=canvas.parentElement.offsetHeight;
  const cam=new THREE.PerspectiveCamera(40,W/H,0.01,1000);
  cam.position.set(-1.5,0.3,7.5); cam.lookAt(-1.5,0.3,0); cam.updateProjectionMatrix();
  const g=new THREE.Group(); scene.add(g);
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,1.2)); body.position.set(0,-0.1,0); wf(body,g);
  const lid =new THREE.Mesh(new THREE.BoxGeometry(2.3,0.22,1.25)); lid.position.set(0,0.71,0); wf(lid,g);
  const ridge=new THREE.Mesh(new THREE.BoxGeometry(2.32,0.08,0.12)); ridge.position.set(0,0.85,0.56); wf(ridge,g);
  const postGeo=new THREE.BoxGeometry(0.1,0.5,0.1);
  const postL=new THREE.Mesh(postGeo); postL.position.set(-0.3,1.1,0); wf(postL,g);
  const postR=new THREE.Mesh(postGeo.clone()); postR.position.set(0.3,1.1,0); wf(postR,g);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.1,0.1)); bar.position.set(0,1.37,0); wf(bar,g);
  const lx=-1.18, seamY=0.62;
  const plate=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.60,0.36)); plate.position.set(lx,seamY-0.18,0); wf(plate,g);
  const pivot=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.07,0.40)); pivot.position.set(lx,seamY+0.14,0); wf(pivot,g);
  const levL=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.44,0.07)); levL.position.set(lx,seamY-0.10,-0.15); wf(levL,g);
  const levR=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.44,0.07)); levR.position.set(lx,seamY-0.10,0.15); wf(levR,g);
  const thumb=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.14,0.34)); thumb.position.set(lx,seamY-0.38,0); wf(thumb,g);
  g.rotation.set(0.52,0.4,-Math.PI/2); g.scale.setScalar(0.55);
  (function animate(){ requestAnimationFrame(animate); g.rotation.y+=0.004; r.render(scene,cam); })();
}
</script>

<script>
// ── CDK: Pi rack ──
function initCDK(canvas) {
  const scene=new THREE.Scene(), wf=makeWF(0x7B22B0, 0xe8d0ff);
  const r=makeRenderer(canvas);
  const W=canvas.parentElement.offsetWidth, H=canvas.parentElement.offsetHeight;
  const cam=new THREE.PerspectiveCamera(40,W/H,0.01,1000);
  const camX=-2.8; cam.position.set(camX,0,13.5); cam.lookAt(camX,0,0); cam.updateProjectionMatrix();
  const g=new THREE.Group(); scene.add(g);
  const RW=2.0,RD=1.42,RH=3.21,POST=0.13,CAP=0.235,U1=0.316;
  [[-1,1],[-1,-1],[1,1],[1,-1]].forEach(([sx,sz])=>{
    const p=new THREE.Mesh(new THREE.BoxGeometry(POST,RH,POST));
    p.position.set(sx*(RW/2-POST/2),0,sz*(RD/2-POST/2)); wf(p,g);
  });
  const tc=new THREE.Mesh(new THREE.BoxGeometry(RW,CAP,RD)); tc.position.set(0,RH/2,0); wf(tc,g);
  const bc=new THREE.Mesh(new THREE.BoxGeometry(RW,CAP,RD)); bc.position.set(0,-RH/2,0); wf(bc,g);
  const fp=new THREE.Mesh(new THREE.BoxGeometry(RW-POST*2,RH-CAP*2,0.04)); fp.position.set(0,0,RD/2-POST/2); wf(fp,g);
  const bk=new THREE.Mesh(new THREE.BoxGeometry(RW-POST*2,RH-CAP*2,0.04)); bk.position.set(0,0,-RD/2+POST/2); wf(bk,g);
  [-1,1].forEach(sx=>{ const s=new THREE.Mesh(new THREE.BoxGeometry(0.04,RH-CAP*2,RD-POST*2)); s.position.set(sx*(RW/2-POST/2),0,0); wf(s,g); });
  const BD=0.808,BW=0.18,BH=0.181,FW=0.108,FH=0.071,CT=0.031, baseY=RH/2+CAP/2;
  function makeWedge(width,zOuter,yBottom,zInner,yTop) {
    const x0=-width/2,x1=width/2,p=[];
    const tri=(ax,ay,az,bx,by,bz,cx,cy,cz)=>p.push(ax,ay,az,bx,by,bz,cx,cy,cz);
    tri(x0,yBottom,zOuter,x0,yTop,zInner,x0,yTop,zOuter);
    tri(x1,yBottom,zOuter,x1,yTop,zOuter,x1,yTop,zInner);
    tri(x0,yBottom,zOuter,x1,yBottom,zOuter,x1,yTop,zOuter);
    tri(x0,yBottom,zOuter,x1,yTop,zOuter,x0,yTop,zOuter);
    tri(x0,yTop,zOuter,x1,yTop,zOuter,x1,yTop,zInner);
    tri(x0,yTop,zOuter,x1,yTop,zInner,x0,yTop,zInner);
    tri(x0,yBottom,zOuter,x1,yBottom,zOuter,x1,yTop,zInner);
    tri(x0,yBottom,zOuter,x1,yTop,zInner,x0,yTop,zInner);
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(p),3));
    geo.computeVertexNormals(); return new THREE.Mesh(geo);
  }
  [-1,1].forEach(sx=>{
    const hx=sx*(RW/2-POST/2);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(BW,CT,BD)); cb.position.set(hx,baseY+BH-CT/2,0); wf(cb,g);
    const ff=new THREE.Mesh(new THREE.BoxGeometry(BW,FH,FW)); ff.position.set(hx,baseY+FH/2,-(BD/2-FW/2)); wf(ff,g);
    const bf=new THREE.Mesh(new THREE.BoxGeometry(BW,FH,FW)); bf.position.set(hx,baseY+FH/2,BD/2-FW/2); wf(bf,g);
    const fw=makeWedge(BW,-BD/2,baseY+FH,-BD/2+FW,baseY+BH-CT); fw.position.set(hx,0,0); wf(fw,g);
    const bw=makeWedge(BW,BD/2,baseY+FH,BD/2-FW,baseY+BH-CT); bw.position.set(hx,0,0); wf(bw,g);
  });
  const FZ=RD/2-POST/2, FW2=RW-POST*2;
  const piP=new THREE.Mesh(new THREE.BoxGeometry(FW2,U1*2,0.05)); piP.position.set(0,RH/2-CAP-U1,FZ+0.005); wf(piP,g);
  [-0.35,-0.12,0.12,0.35].forEach(ox=>{
    const cl=new THREE.Mesh(new THREE.BoxGeometry(FW2*0.12,U1*0.55,0.03)); cl.position.set(ox*FW2,RH/2-CAP-U1,FZ+0.06); wf(cl,g);
  });
  g.rotation.set(0.28,0.55,0);
  (function animate(){ requestAnimationFrame(animate); g.rotation.y+=0.004; r.render(scene,cam); })();
}
</script>

<script>
// ── AO: SpaceX Dragon OBJ ──
function initAO(canvas) {
  const scene=new THREE.Scene();
  const r=makeRenderer(canvas);
  const W=canvas.parentElement.offsetWidth, H=canvas.parentElement.offsetHeight;
  const cam=new THREE.PerspectiveCamera(45,W/H,0.01,10000);
  const HULL=0x1A5C8A, LINE=0xe8f4ff;
  const matH=new THREE.MeshBasicMaterial({color:HULL,polygonOffset:true,polygonOffsetFactor:4,polygonOffsetUnits:4});
  const matE=new THREE.LineBasicMaterial({color:LINE,transparent:true,opacity:0.7});
  const matO=new THREE.MeshBasicMaterial({color:LINE,side:THREE.BackSide,transparent:true,opacity:0.6,depthTest:true,depthWrite:false});
  let modelRoot=null;
  function buildWireframe(obj) {
    // Collect meshes FIRST — adding children during traverse causes infinite recursion
    const meshes=[];
    obj.traverse(c=>{ if(c.isMesh) meshes.push(c); });
    meshes.forEach(c=>{
      c.material=matH.clone();
      const og=c.geometry.clone(); og.computeVertexNormals();
      const p=og.attributes.position,n=og.attributes.normal;
      for(let i=0;i<p.count;i++) p.setXYZ(i,p.getX(i)+n.getX(i)*0.016,p.getY(i)+n.getY(i)*0.016,p.getZ(i)+n.getZ(i)*0.016);
      p.needsUpdate=true;
      c.add(new THREE.Mesh(og,matO.clone()));
      c.add(new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry,9),matE.clone()));
    });
  }
  function fitCamera(obj) {
    obj.rotation.set(0,0,Math.PI/2); obj.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(obj);
    const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z);
    const fov=cam.fov*(Math.PI/180),dist=(maxDim/(2*Math.tan(fov/2)))*2.2;
    const camX=center.x-maxDim*0.65;
    cam.position.set(camX,center.y,center.z+dist); cam.lookAt(camX,center.y,center.z);
    cam.near=dist*0.001; cam.far=dist*100; cam.updateProjectionMatrix();
  }
  (function animate(){ requestAnimationFrame(animate); if(modelRoot) modelRoot.rotation.y+=0.004; r.render(scene,cam); })();
  fetch('dragon.obj')
    .then(res=>{ if(!res.ok) throw new Error(res.status); return res.arrayBuffer(); })
    .then(buf=>{ const text=new TextDecoder().decode(buf);
      modelRoot=new THREE.OBJLoader().parse(text);
      scene.add(modelRoot); fitCamera(modelRoot); buildWireframe(modelRoot); })
    .catch(e=>console.warn('dragon.obj fetch failed:',e));
}

// ── MSO: Monitor stack ──
function initMSO(canvas) {
  const scene=new THREE.Scene(), wf=makeWF(0x8A1A1A, 0xffb0b0);
  const r=makeRenderer(canvas);
  const W=canvas.parentElement.offsetWidth, H=canvas.parentElement.offsetHeight;
  const cam=new THREE.PerspectiveCamera(38,W/H,0.01,1000);
  cam.position.set(-3.8,0,22); cam.lookAt(-3.8,0,0); cam.updateProjectionMatrix();
  const matL=new THREE.LineBasicMaterial({color:0xffb0b0,transparent:true,opacity:0.75});
  function line(pts){ const g=new THREE.BufferGeometry().setFromPoints(pts); return new THREE.Line(g,matL); }
  const MW=2.4,MH=1.1,MD=0.09,BZ=0.07,GAP=0.12;
  const yPos=[MH+GAP, 0, -(MH+GAP)];
  const root=new THREE.Group(); scene.add(root);
  yPos.forEach(yp=>{ const body=new THREE.Mesh(new THREE.BoxGeometry(MW,MH,MD)); body.position.set(0,yp,0); wf(body,root); });
  // Coffee glyph (top screen)
  const yp0=yPos[0],z=MD/2+0.005,S=0.52,cx=0,cy=yp0, verts=[];
  function seg(ax,ay,bx,by){verts.push(ax,ay,z,bx,by,z);}
  function arc(pts,ox,oy,rx,ry,a0,a1,steps){
    for(let i=0;i<=steps;i++){const a=a0+(a1-a0)*(i/steps);pts.push(new THREE.Vector3(ox+Math.cos(a)*rx,oy+Math.sin(a)*ry,z));}}
  const tw=S*0.75,bw=S*0.55,ch=S*0.72,ty=cy+S*0.05,by2=ty-ch;
  seg(cx-tw/2,ty,cx+tw/2,ty); seg(cx-bw/2,by2,cx+bw/2,by2);
  seg(cx-tw/2,ty,cx-bw/2,by2); seg(cx+tw/2,ty,cx+bw/2,by2);
  const sp=[]; arc(sp,cx,by2-S*0.06,S*0.55,S*0.10,Math.PI,0,24); root.add(line(sp));
  seg(cx-S*0.62,by2-S*0.06,cx+S*0.62,by2-S*0.06);
  const hp=[]; const hcx=cx+tw/2,hcy=ty-ch*0.35;
  arc(hp,hcx+S*0.14,hcy,S*0.14,S*0.22,Math.PI*0.5,-Math.PI*0.5,18); root.add(line(hp));
  seg(hcx,hcy+S*0.22,hcx+S*0.14,hcy+S*0.22); seg(hcx,hcy-S*0.22,hcx+S*0.14,hcy-S*0.22);
  [-S*0.22,0,S*0.22].forEach((sx,i)=>{
    const stPts=[],sb=ty+S*0.08,st=ty+S*0.52;
    for(let j=0;j<=16;j++){const t=j/16;stPts.push(new THREE.Vector3(cx+sx+Math.sin(t*Math.PI*2+i*2.1)*S*0.08,sb+(st-sb)*t,z));}
    root.add(line(stPts));
  });
  const cg=new THREE.BufferGeometry(); cg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
  root.add(new THREE.LineSegments(cg,matL));
  // Waveform (mid screen)
  const yp1=yPos[1],x0=-(MW/2-BZ)+0.1,x1=MW/2-BZ-0.1, wpts=[];
  for(let i=0;i<=60;i++){const t=i/60;wpts.push(new THREE.Vector3(x0+(x1-x0)*t,yp1+Math.sin(t*Math.PI*3.5)*0.22*Math.sin(t*Math.PI),MD/2+0.005));}
  root.add(line(wpts));
  // Bar chart (bot screen)
  const yp2=yPos[2],bx0=-(MW/2-BZ)+0.08,by1=yp2+(MH/2-BZ)-0.06;
  const fills=[0.9,0.55,0.72,0.38,0.85,0.48,0.63,0.30],rh=0.065,xMax=MW-BZ*2-0.16,bv=[];
  fills.forEach((f,i)=>{
    const ry=by1-i*(rh+0.025),fw=xMax*f;
    bv.push(bx0,ry,MD/2+0.005,bx0+fw,ry,MD/2+0.005);
    bv.push(bx0,ry-rh,MD/2+0.005,bx0+fw,ry-rh,MD/2+0.005);
    bv.push(bx0,ry,MD/2+0.005,bx0,ry-rh,MD/2+0.005);
    bv.push(bx0+fw,ry,MD/2+0.005,bx0+fw,ry-rh,MD/2+0.005);
  });
  const bg2=new THREE.BufferGeometry(); bg2.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bv),3));
  root.add(new THREE.LineSegments(bg2,matL));
  root.rotation.set(0.10,-0.44,0); root.scale.setScalar(1.8);
  (function animate(){ requestAnimationFrame(animate); root.rotation.y+=0.004; r.render(scene,cam); })();
}

// ── Legacy background init functions (keyed by app code) ──
const LEGACY_BG = { STB: initSTB, CDK: initCDK, AO: initAO, MSO: initMSO };

// ── Wire all backgrounds (dynamic) ──
function initAllBackgrounds() {
  APPS.forEach(app => {
    const canvasId = 'bg-' + app.code.toLowerCase();
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    if (app.bg_js) {
      // Dynamic: execute stored function body
      try {
        new Function('canvas', 'THREE', 'makeRenderer', 'makeWF', app.bg_js)(canvas, THREE, makeRenderer, makeWF);
      } catch(e) { console.warn('bg_js error for', app.code, e); }
    } else if (LEGACY_BG[app.code]) {
      // Fallback: use built-in function
      LEGACY_BG[app.code](canvas);
    } else {
      // No background — canvas stays hidden, flat color shows
      return;
    }
    canvas.classList.add('show');
  });
}
</script>
